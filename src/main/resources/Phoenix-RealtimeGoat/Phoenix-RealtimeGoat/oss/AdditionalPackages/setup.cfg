# TC_42: setup.cfg detection — scanned as valid Python dependency file
# TC_43: [options] install_requires multi-line — all packages parsed
# TC_44: [options.extras_require] — extra deps scanned
# TC_45: version range specifiers (>=, <=, ~=, !=) handled correctly
# TC_46: vulnerable deps highlighted on correct line in IDE

[metadata]
name = vuln-python-app
version = 1.0.0
description = Vulnerable Python Application for SCA Testing
author = Test Team
author_email = test@example.com
license = MIT
url = https://example.com
long_description = file: README.md
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License

[options]
packages = find:
python_requires = >=3.8
zip_safe = False
include_package_data = True

# TC_43: multi-line install_requires — all packages must be parsed
install_requires =
    Flask==2.0.1
    Django==3.2.4
    SQLAlchemy==1.4.22
    requests==2.27.1
    PyYAML==5.3.1
    cryptography==3.3.1
    paramiko==2.7.2
    Pillow==8.3.1
    urllib3==1.26.4
    Jinja2==3.0.1
    lxml==4.6.3
    celery==4.4.7
    aiohttp==3.7.4
    redis==3.5.3
    psycopg2-binary==2.9.1
    gunicorn==20.1.0

# TC_45: version range specifiers — parser must handle all operators
[options.extras_require]
dev =
    pytest>=6.0.0
    black>=21.0,!=21.5b0
    flake8<=5.0.0
    mypy~=0.9.0
    bandit!=1.7.1,>=1.7.0

# TC_44: [options.extras_require] parsed
docs =
    Sphinx>=4.0.0
    sphinx-rtd-theme>=0.5.0

ml =
    numpy>=1.19.0
    pandas>=1.2.0
    scikit-learn~=0.24.0

[options.package_data]
* = *.txt, *.rst, *.cfg
